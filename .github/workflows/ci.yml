name: CI

on:
  push:
    branches: [main, docs/sprint-plan]
  pull_request:
    branches: [main, docs/sprint-plan]

jobs:
  quality:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run mypy .

  dependency-audit:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - name: Scan dependencies for known vulnerabilities
        run: |
          uv pip compile pyproject.toml -o requirements-audit.txt
          uvx pip-audit --strict -r requirements-audit.txt

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run pytest

  build-spa:
    name: build web SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Verify SPA output
        run: test -f src/mercure_gateway/web/static/index.html

  perf-gates:
    name: performance gates (§5.6, K8)
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - name: Run perf gates
        run: uv run python scripts/check_perf_gates.py

  coverage:
    name: coverage gate (≥80%)
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - name: Run tests with coverage
        run: uv run pytest --cov=mercure_gateway --cov-fail-under=80

  package-windows:
    name: Windows packaging (S06-T9)
    runs-on: windows-latest
    needs: [quality, test, build-spa]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - name: Setup Rust (Tauri)
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Build Tauri app (Windows)
        run: cargo tauri build --no-bundle
        working-directory: src-tauri
      - name: K6 installer size gate
        shell: pwsh
        working-directory: src-tauri
        run: |
          $size = (Get-Item "target/release/mercure-gateway.exe").Length / 1MB
          Write-Host "Binary size: $([math]::Round($size,1)) MB"
          if ($size -gt 250) { Write-Host "::error::K6 size gate exceeded: $([math]::Round($size,1)) MB > 250 MB"; exit 1 }
          Write-Host "K6 PASS"

  package-linux:
    name: Linux packaging (AppImage + deb)
    runs-on: ubuntu-latest
    needs: [quality, test, build-spa]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - name: Setup Rust (Tauri)
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Linux system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Build Tauri app (Linux AppImage + deb)
        run: cargo tauri build --bundles deb,appimage
        working-directory: src-tauri
      - name: K6 size gate
        run: |
          size=$(du -sm "src-tauri/target/release/bundle/deb/"*.deb 2>/dev/null | cut -f1)
          echo "deb size: $size MB"
          if [ -n "$size" ] && [ "$size" -gt 500 ]; then echo "::error::K6 size gate exceeded: $size MB > 500 MB"; exit 1; fi
          echo "K6 PASS"