name: CI

on:
  push:
    branches: [main, docs/sprint-plan]
  pull_request:
    branches: [main, docs/sprint-plan]

jobs:
  quality:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run mypy .

  dependency-audit:
    name: dependency audit (pip-audit + npm + cargo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - name: Scan Python dependencies for known vulnerabilities
        run: |
          uv pip compile pyproject.toml -o requirements-audit.txt
          uvx pip-audit --strict -r requirements-audit.txt
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Scan SPA production dependencies (high+ only)
        working-directory: web
        # --omit=dev: the vite/vitest advisories are dev-server/UI paths that
        # never ship in the built SPA; production deps must be clean.
        run: npm audit --omit=dev --audit-level=high
      - name: Scan Rust dependencies (RUSTSEC advisories)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run pytest

  build-spa:
    name: build web SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Verify SPA output
        run: test -f src/mercure_gateway/web/static/index.html

  perf-gates:
    name: performance gates (§5.6, K8)
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - name: Run perf gates
        run: uv run python scripts/check_perf_gates.py

  e2e:
    name: E2E (Playwright, seeded gateway)
    runs-on: ubuntu-latest
    needs: [quality, test, build-spa]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      # Playwright comes from the runner machine install (root node_modules is
      # a dev-box convention) — install it explicitly in CI.
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      # Seed the isolated gateway (temp spool, ports 18299/18113) and export
      # the KEY=value lines for the Playwright global setup.
      - name: Seed E2E gateway
        run: |
          uv run python e2e/seed.py > /tmp/e2e-env.txt
          cat /tmp/e2e-env.txt >> "$GITHUB_ENV"
      - name: Run E2E tests
        run: npx playwright test -c playwright.config.ts --reporter=line
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  coverage:
    name: coverage gate (≥80%)
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - name: Run tests with coverage
        run: uv run pytest --cov=mercure_gateway --cov-fail-under=80

  package-windows:
    name: Windows packaging (S06-T9)
    runs-on: windows-latest
    needs: [quality, test, build-spa]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - name: Setup Rust (Tauri)
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Freeze backend (PyInstaller onedir sidecar)
        run: uv run python scripts/package_backend.py
      - name: Build Tauri app (Windows)
        run: cargo tauri build --no-bundle
        working-directory: src-tauri
      - name: K6 installer size gate (shell exe + backend bundle)
        working-directory: src-tauri
        run: >-
          uv run python ../scripts/check_installer_size.py
          target/release/mercure-gateway.exe binaries/mercure-gateway
          --limit-mb 250
      - name: Smoke test frozen backend
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "src-tauri/binaries/mercure-gateway/mercure-gateway.exe" -ArgumentList "--web","--port","8099" -PassThru -NoNewWindow
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8099/api/system/health" -UseBasicParsing -TimeoutSec 2
              if ($r.Content -match '"ok"') { $ok = $true; break }
            } catch { }
          }
          if (-not $ok) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue; Write-Host "::error::frozen backend health check failed"; exit 1 }
          Stop-Process -Id $proc.Id -Force
          Write-Host "Frozen backend smoke PASS"

  package-linux:
    name: Linux packaging (AppImage + deb)
    runs-on: ubuntu-latest
    needs: [quality, test, build-spa]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - name: Setup Rust (Tauri)
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Linux system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Build Tauri app (Linux AppImage + deb)
        run: cargo tauri build --bundles deb,appimage
        working-directory: src-tauri
      - name: K6 size gate
        run: |
          uv run python scripts/check_installer_size.py \
            src-tauri/target/release/bundle/deb/*.deb --limit-mb 500