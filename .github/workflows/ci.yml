name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# docs/sprint-plan was merged into main on 2026-09-09 and has had no push
# since, so triggering on it only re-ran the whole matrix against a tree that
# no longer exists as a separate line of development.

jobs:
  quality:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run mypy .

  # The SPA's api-schema.ts is generated from the backend's OpenAPI export.
  # A route or model change that never regenerated it is exactly how the
  # SPA's fetchConfig drifted to Record<string, unknown> and papered over the
  # wizard's wrong-section merge (review P1-9). This is `just gen-api-check`
  # in CI: regenerate to /tmp and diff against the committed file.
  api-schema-drift:
    name: api-schema.ts drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Export the current OpenAPI schema
        run: uv run python scripts/export_openapi.py --output /tmp/api-schema-check.json
      - name: Regenerate the SPA types from it
        run: npx openapi-typescript /tmp/api-schema-check.json -o /tmp/api-schema-check.ts
        working-directory: web
      - name: Diff against the committed types
        run: diff -u src/types/api-schema.ts /tmp/api-schema-check.ts
        working-directory: web

  # A locally-frozen sidecar (src-tauri/binaries/, gitignored) is a snapshot of
  # a past tree and nothing else compares it to the current one. The committed
  # one was 1.1.0-rc1 and predated _enforce_bind_security, so an installer
  # built from it would have served an unauthenticated admin panel on the LAN
  # instead of refusing (review P0-2). Absent is fine — CI freezes its own —
  # present-but-stale is the failure this catches.
  sidecar-staleness:
    name: frozen sidecar staleness check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run pytest tests/test_package_backend.py -q

  dependency-audit:
    name: dependency audit (pip-audit + npm + cargo)
    runs-on: ubuntu-latest
    # rustsec/audit-check publishes a check-run; without this the
    # GITHUB_TOKEN is read-only and publishing fails the step even when
    # the scan itself passes.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - name: Scan Python dependencies for known vulnerabilities
        run: |
          uv pip compile pyproject.toml -o requirements-audit.txt
          uvx pip-audit --strict -r requirements-audit.txt
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Scan SPA production dependencies (high+ only)
        working-directory: web
        # --omit=dev: the vite/vitest advisories are dev-server/UI paths that
        # never ship in the built SPA; production deps must be clean.
        run: npm audit --omit=dev --audit-level=high
      - name: Scan Rust dependencies (RUSTSEC advisories)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
        # integration tests open real sockets (the perf gate's --real mode
        # delivers ~100 associations to a local SCP); they flap on a loaded
        # shared runner and belong to the nightly/integration path, not the
        # per-push matrix (review P1-7).
      - run: uv run pytest -m "not integration"

  # The unit-only fast loop. The `slow` marker is deselected *only* here —
  # nowhere else in the pipeline — so this is the one place a push gets a
  # signal without waiting on the timing tests. It carries 5 tests
  # (test_backoff_holds_route_against_other_workers, the read-connection
  # starvation test, the 25-concurrent-associations wire test, and the two
  # real-handler perf-gate runs, which are also `integration` and so already
  # off the per-push matrix); the `test` job above keeps all of them except
  # the integration three. One OS, no coverage, no matrix, so it lands while
  # the real suite is still spinning up. It is not a gate replacement: the
  # authoritative full run is still the `test` job above, which `perf-gates`
  # and `coverage` still depend on. A selector that quietly matched
  # everything or nothing would defeat the point — the intent is
  # `-m "not slow and not integration"` = 1016 of 1022 tests (6 deselected:
  # the 5 slow + 3 integration markers, minus the 2 that carry both).
  test-fast:
    name: unit tests (fast loop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run pytest -m "not slow and not integration" -q

  build-spa:
    name: build web SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Verify SPA output
        run: test -f src/mercure_gateway/web/static/index.html

  # P1-5: npm run build (= tsc -b && vite build) runs in four jobs, so the SPA
  # *is* type-checked in CI — but vitest (68 tests incl. the a11y scan) and
  # eslint had no CI equivalent at all, so a failing test or a lint violation
  # could merge with no signal and local/CI lint drift was unbounded.
  web:
    name: SPA tests + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # The repo has no root package.json; every npm invocation must target
      # web/ or npx resolves against a parent-dir node_modules.
      - run: npm run lint
        working-directory: web
      - run: npx tsc -b
        working-directory: web
      - run: npm run test
        working-directory: web

  perf-gates:
    name: performance gates (§5.6, K8)
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      # P1-7: the CI gate stays in synthetic mode. That mode's scripted
      # handler does no I/O, so it measures the forwarder's queue/claim/route
      # path only — deliberately, because that part's regression is
      # CI-detectable. --real delivers the same batch through the real
      # DICOMHandler to a live C-STORE SCP (the two numbers differ by ~300×),
      # but a socket-bound measurement flaps on a loaded shared runner. It
      # belongs on the integration path: `just perf-gates-real`, and the
      # integration-marked tests the test job deselects below.
      - name: Run perf gates
        run: uv run python scripts/check_perf_gates.py

  e2e:
    name: E2E (Playwright, seeded gateway)
    runs-on: ubuntu-latest
    needs: [quality, test, build-spa]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      # The repo has no root package.json (the SPA lives in web/); dev boxes
      # resolve @playwright/test from a parent-dir install, CI must not.
      # @playwright/test is what playwright.config.ts + e2e specs import —
      # the bare `playwright` package leaves them dangling (CI run
      # 34893336322: "Cannot find module '@playwright/test'").
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      # Seed the isolated gateway (temp spool, ports 18299/18113) and export
      # the KEY=value lines for the Playwright global setup.
      - name: Seed E2E gateway
        run: |
          uv run python e2e/seed.py > /tmp/e2e-env.txt
          cat /tmp/e2e-env.txt >> "$GITHUB_ENV"
      - name: Run E2E tests
        run: npx playwright test -c playwright.config.ts --reporter=line
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  coverage:
    name: coverage gate (≥80%)
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - name: Run tests with coverage
        # Same integration deselection as the test job — the coverage gate
        # must not go green by counting the socket-bound path it skipped.
        run: uv run pytest -m "not integration" --cov=mercure_gateway --cov-fail-under=80

  # `paths-ignore` cannot be scoped to a single job — it lives on the `on:`
  # trigger and would also silence `quality`, `test` and `web`, which must
  # run on every push. This job is the job-level equivalent of
  # `paths-ignore: ["*.md", "docs/**"]` for the two packaging jobs only.
  # Without it a README-only push spins up a windows-latest runner, a Rust
  # toolchain, a Node install and a full PyInstaller freeze to rebuild an
  # installer that nothing in the diff could have changed.
  code-changed:
    name: detect non-doc changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The default depth of 1 leaves no parent to diff against.
          fetch-depth: 2
      - name: Diff against the previous commit
        id: diff
        # A missing parent (first commit on a branch, rewritten history)
        # means we cannot tell what changed. Fail open: run the packaging
        # jobs rather than skip them on a gap in the diff.
        run: |
          if ! git rev-parse --verify "HEAD^" >/dev/null 2>&1; then
            echo "No parent commit — assuming code changed."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On pull_request, checkout resolves the merge commit whose first
          # parent is the base branch, so this is the PR's own diff; on push
          # it is the commit's diff against its predecessor.
          if git diff --name-only "HEAD^" HEAD | grep -vE '^docs/|\.md$' | grep -q .; then
            echo "Non-doc changes detected."
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs/** and *.md changed — skipping the packaging jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  package-windows:
    name: Windows packaging (S06-T9)
    runs-on: windows-latest
    needs: [quality, test, build-spa, code-changed]
    if: ${{ needs.code-changed.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - name: Setup Rust (Tauri)
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Freeze backend (PyInstaller onedir sidecar)
        run: uv run python scripts/package_backend.py
      - name: Build Tauri app (Windows)
        run: cargo tauri build --no-bundle
        working-directory: src-tauri
      - name: K6 installer size gate (shell exe + backend bundle)
        working-directory: src-tauri
        run: >-
          uv run python ../scripts/check_installer_size.py
          target/release/mercure-gateway.exe binaries/mercure-gateway
          --limit-mb 250
      - name: Smoke test frozen backend
        shell: pwsh
        run: |
          # The frozen binary must be the backend this CI just built, not a
          # stale snapshot. A version mismatch here is the rc1 failure mode:
          # the bundle boots and answers health checks while running an older
          # backend — the committed snapshot predated the bind-security fix,
          # so an installer from it would have served an unauthenticated admin
          # panel on the LAN instead of refusing to (review P0-2).
          $expected = (uv run python -c "import re,sys;print(re.search(r'^__version__ = \"(.+)\"',open('src/mercure_gateway/__init__.py').read(),re.M).group(1))").Trim()
          $proc = Start-Process -FilePath "src-tauri/binaries/mercure-gateway/mercure-gateway.exe" -ArgumentList "--web","--port","8099" -PassThru -NoNewWindow
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8099/api/system/health" -UseBasicParsing -TimeoutSec 2
              if ($r.Content -match '"ok"') {
                $ok = $true
                $health = $r.Content
                break
              }
            } catch { }
          }
          if (-not $ok) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue; Write-Host "::error::frozen backend health check failed"; exit 1 }
          Stop-Process -Id $proc.Id -Force
          if (-not ($health -match [regex]::Escape($expected))) {
            Write-Host "::error::frozen backend reports a stale version (expected $expected, got $health)"
            exit 1
          }
          Write-Host "Frozen backend smoke PASS (version $expected)"

  package-linux:
    name: Linux packaging (AppImage + deb)
    runs-on: ubuntu-latest
    needs: [quality, test, build-spa, code-changed]
    if: ${{ needs.code-changed.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - name: Setup Rust (Tauri)
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Linux system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Freeze backend (PyInstaller onedir sidecar)
        run: uv run python scripts/package_backend.py
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked
      # The provenance parsers live in src/sidecar.rs so that this ordinary
      # `cargo test` covers them; in build.rs they would compile but never
      # run, since cargo builds a build script as a build script only.
      - name: Unit-test the build script's provenance parsers
        run: cargo test
        working-directory: src-tauri
      - name: Build Tauri app (Linux AppImage + deb)
        run: cargo tauri build --bundles deb,appimage
        working-directory: src-tauri
      - name: K6 size gate
        run: |
          uv run python scripts/check_installer_size.py \
            src-tauri/target/release/bundle/deb/*.deb --limit-mb 500
