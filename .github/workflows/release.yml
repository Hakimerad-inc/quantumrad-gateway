name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Release tag to publish (e.g. v1.1.0-rc1). Dispatch from main to run
          the CURRENT pipeline against an already-pushed tag — tags stay
          immutable; this is how a failed release leg is re-dispatched.
        required: false
        default: ""

# Stage 1 (build): the desktop bundles for both OSes, signed with the release
# Ed25519 key (ADR-0006). Stage 2 (release): merges the per-platform updater
# manifests and attaches installers + .sig sidecars + latest.json to a GitHub
# release. Signing secrets:
#   MERCURE_TAURI_PRIVATE_KEY / MERCURE_TAURI_PRIVATE_KEY_PASSWORD
#   MERCURE_TAURI_PUBLIC_KEY (injected via tauri.release.conf.json overlay)
# See docs/dev/packaging.md for the key-custody workflow (keys are generated
# once on a maintainer machine — never in CI) and docs/dev/release-runbook.md
# for the tag-day sequence.

jobs:
  build:
    name: ${{ matrix.os }} bundle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: NSIS only. `targets: "all"` would also emit MSI, and the
          # MSI version field rejects semver pre-release identifiers
          # ("1.1.0-rc1" → bundle error, first release run 34902860370). NSIS
          # is what the Tauri updater installs on Windows anyway.
          # Linux: deb + AppImage, mirroring ci.yml package-linux (rpm is not
          # a supported target and would need extra tooling).
          - os: windows-latest
            target: windows-x86_64
            bundles: nsis
          - os: ubuntu-latest
            target: linux-x86_64
            bundles: deb,appimage
    steps:
      - uses: actions/checkout@v4
        with:
          # tag-push: GITHUB_REF_NAME is the tag. workflow_dispatch with the
          # tag input: check the (immutable) tag's commit so built sources match
          # the published version — the *pipeline* is this (fixed) branch.
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - name: Setup Rust (Tauri)
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Install Linux system deps
        if: matrix.target == 'linux-x86_64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - name: Freeze backend (PyInstaller onedir sidecar)
        run: uv run python scripts/package_backend.py
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Write release config overlay (updater pubkey + signed artifacts)
        shell: bash
        env:
          MERCURE_TAURI_PUBLIC_KEY: ${{ secrets.MERCURE_TAURI_PUBLIC_KEY }}
        run: |
          cat > src-tauri/tauri.release.conf.json <<EOF
          {
            "plugins": { "updater": { "pubkey": "$MERCURE_TAURI_PUBLIC_KEY" } },
            "bundle": { "createUpdaterArtifacts": true }
          }
          EOF
      - name: Build + sign Tauri bundles
        working-directory: src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.MERCURE_TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.MERCURE_TAURI_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --bundles ${{ matrix.bundles }} --config tauri.release.conf.json
      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.sig
          if-no-files-found: error

  release:
    name: Publish GitHub release + updater manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all bundle artifacts
        uses: actions/download-artifact@v4
        with:
          name: bundles-windows-x86_64
          path: dist
      - name: Download linux bundles
        uses: actions/download-artifact@v4
        with:
          name: bundles-linux-x86_64
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      # Tauri emits .sig sidecars next to each artifact when the signing env
      # is present. latest.json is assembled ONCE here from BOTH platforms'
      # artifacts (a per-matrix assembly would clobber the other platform on
      # upload) in the Tauri updater format — NOT the Python Updater's flat
      # {version,url,signature,checksum_sha256} manifest, which stays an
      # independent operator-configured advisory check for headless deployments.
      - name: Assemble updater manifest
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, glob, os
          from datetime import datetime, timezone
          version = os.environ["RELEASE_REF"].lstrip("v")
          base = (
              os.environ.get("GITHUB_SERVER_URL", "https://github.com")
              + "/"
              + os.environ["GITHUB_REPOSITORY"]
              + "/releases/latest/download"
          )
          platforms = {}
          candidates = {"windows-x86_64": None, "linux-x86_64": None}
          for sig_path in glob.glob("dist/**/*.sig", recursive=True):
              artifact = sig_path[:-4]
              name = os.path.basename(artifact)
              if name.endswith((".exe", ".msi")):
                  key, prio = "windows-x86_64", 0 if name.endswith(".exe") else 1
              else:
                  # Updater manifests hold ONE artifact per platform: prefer
                  # the AppImage (what the Tauri updater swaps on Linux) over
                  # the deb; the deb is still uploaded as an installer asset.
                  key, prio = "linux-x86_64", 0 if name.endswith(".AppImage") else 1
              if candidates[key] is None or prio < candidates[key][0]:
                  candidates[key] = (prio, name, sig_path)
          for key, cand in candidates.items():
              if cand:
                  _, name, sig_path = cand
                  platforms[key] = {"signature": open(sig_path).read(), "url": f"{base}/{name}"}
          if not platforms:
              raise SystemExit("no .sig sidecars found under dist/ — check createUpdaterArtifacts")
          # The Tauri updater client rejects manifests with an empty pub_date;
          # default to "now" unless the tag-day runbook pins one explicitly.
          pub_date = os.environ.get("RELEASE_PUB_DATE") or datetime.now(timezone.utc).strftime(
              "%Y-%m-%dT%H:%M:%SZ")
          manifest = {
              "version": version,
              "notes": f"QuantumRAD Gateway {version}",
              "pub_date": pub_date,
              "platforms": platforms,
          }
          # Written into dist/ so the upload step's `find dist -type f`
          # glob picks it up. Writing it to the repo root meant the
          # assembled updater manifest was printed and then never
          # published — while tauri.conf.json points the updater at
          # .../releases/latest/download/latest.json, which 404s.
          os.makedirs("dist", exist_ok=True)
          with open("dist/latest.json", "w") as fh:
              json.dump(manifest, fh, indent=2)
          print(json.dumps(manifest, indent=2))
          PY
      # P1-13: publish the dependency story of the frozen sidecar with the
      # release. uv.lock is committed but never attached, so an operator (or
      # a scanner) asking "which versions are in this appliance?" had to
      # diff the repo at the tag and reconstruct it. This is the resolved
      # build input — see scripts/export_sbom.py for the honest scope note.
      - name: Generate the CycloneDX SBOM for the frozen sidecar
        run: uv run python scripts/export_sbom.py --output dist/sbom.json
      # P1-15: the checksums are the out-of-band integrity channel. latest.json
      # deliberately carries no checksum_sha256 (see the note above), and a
      # signature only proves "this key signed this artifact" — it does not
      # help an operator who wants to confirm a download against a value they
      # read *before* fetching anything. The release body is that channel, so
      # the same sums are printed into it AND attached as SHA256SUMS.
      - name: Compute sha256 checksums of every published artifact
        shell: bash
        run: |
          cd dist
          find . -type f ! -name SHA256SUMS | sed 's|^\./||' | sort | tee /tmp/files.txt
          xargs -a /tmp/files.txt sha256sum | tee SHA256SUMS
          # The body is assembled from a file so nothing in the auto-generated
          # notes (commit text, backticks) can be re-evaluated by the shell.
          {
            gh release view "$RELEASE_REF" --json body -q .body 2>/dev/null || true
            echo
            echo "## Integrity"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo
            echo "Verify with \`sha256sum -c SHA256SUMS\` in the release's download dir."
            echo "The frozen backend's CycloneDX SBOM is attached as sbom.json."
          } > /tmp/notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.tag || github.ref_name }}
      - name: Create or reuse release, upload everything
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_REF" --generate-notes \
            || echo "release $RELEASE_REF already exists — reusing"
          # P1-15: NO --clobber. A re-dispatched run used to overwrite an
          # artifact *and* its .sig together, so a fresh signature over a
          # different artifact still verified against the same compiled-in
          # pubkey — trust degraded to "the key was never misused". Now a
          # conflicting asset fails this step loudly; delete the stale asset
          # by hand and re-dispatch. Non-conflicting assets still upload, so
          # a partial failure does not need a full re-run either.
          set +e
          gh release upload "$RELEASE_REF" $(find dist -type f)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::one or more assets already exist on $RELEASE_REF and were NOT overwritten. Delete the stale asset(s) on the release page, then re-dispatch — never re-publish over a signed artifact."
            exit 1
          fi
          gh release edit "$RELEASE_REF" --notes-file /tmp/notes.md
