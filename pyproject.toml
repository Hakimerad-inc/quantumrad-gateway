[project]
name = "mercure-gateway"
version = "0.1.0"
description = "Lightweight desktop DICOM gateway — store-and-forward to mercure hub or vendor PACS, with report retrieval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pynetdicom>=3.0.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
mercure-gateway = "mercure_gateway.main:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
    "httpx2>=0.1.0",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".claude", "build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
exclude = ["tests", "build", "dist", "\\.venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
