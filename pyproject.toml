[project]
name = "mercure-gateway"
version = "0.1.0"
description = "Lightweight desktop DICOM gateway — store-and-forward to mercure hub or vendor PACS, with report retrieval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pynetdicom>=3.0.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "cryptography>=50.0.1",
    "pylibjpeg-rle>=2.2.0",
    "paramiko>=5.0.0",
    "boto3>=1.43.83",
    "requests>=2.34.2",
    "keyring>=25.7.0",
    # Required by starlette for multipart form parsing (POST /api/config/import).
    "python-multipart>=0.0.9",
]

[project.scripts]
mercure-gateway = "mercure_gateway.main:main"

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    # starlette's testclient (Kludex fork 1.6.x) imports httpx2 with a fallback
    # to httpx. Both are pinned so a mainline-starlette upgrade can never
    # break TestClient by requiring `httpx` alone.
    "httpx2>=2.12,<3",
    "httpx>=0.27,<0.29",
]
# Windows service management (S07-T9): SCM install/uninstall/start/stop via
# pywin32. Windows-only marker so Linux/macOS installs skip the binary wheel.
service = [
    "pywin32>=306; sys_platform == 'win32'",
]
# Backend freeze for the Tauri desktop bundle (scripts/package_backend.py).
package = [
    "pyinstaller>=6.0",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".claude", "build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
exclude = ["tests", "build", "dist", "\\.venv", "src-tauri/binaries"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
norecursedirs = [".*", "__pycache__", "*.egg"]
timeout = 120
filterwarnings = [
    "ignore:'write_like_original' is deprecated:DeprecationWarning:pydicom.filewriter",
    "ignore:Invalid value for VR UI:UserWarning:pydicom.valuerep",
    "ignore:The decoded RLE segment:UserWarning:pydicom.pixels",
]
markers = [
    "slow: duration > 5s (e.g. retry backoff, wire tests)",
    "integration: requires external infrastructure (DICOM, live server)",
]

[tool.coverage.run]
branch = true
source = ["mercure_gateway"]

[tool.coverage.report]
# Windows-only (pywin32) and thin launcher modules can't be exercised on
# Linux; omitting them keeps the gate to meaningful cross-platform code.
omit = [
    "*/service_backend.py",
    "*/ui/__init__.py",
]
fail_under = 80
show_missing = true
